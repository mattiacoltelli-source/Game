<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Taxi Bologna</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2314181d%27/%3E%3Crect x=%274%27 y=%2714%27 width=%2724%27 height=%279%27 rx=%273%27 fill=%27%23ffc928%27/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <canvas id="mini" aria-label="Minimappa"></canvas>
  <div id="top">
    <div id="meter" aria-label="Cronometro"><b id="time">0:00.00</b></div>
    <div id="goal"><svg id="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 20l-7-4-7 4z"/></svg><span id="goal-txt">Vai dal cliente</span><em id="dist"></em></div>
  </div>
  <div id="speed"><b id="kmh">0</b><small>km/h</small></div>
  <div id="toast" aria-live="polite"></div>
</div>

<div id="controls" hidden>
  <div class="pad pad-l">
    <button class="btn steer" data-btn="left" aria-label="Sterza a sinistra"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
    <button class="btn steer" data-btn="right" aria-label="Sterza a destra"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
  </div>
  <div class="pad pad-r">
    <button class="btn brake" data-btn="brake" aria-label="Freno e retromarcia"><span>FRENO</span></button>
    <button class="btn gas" data-btn="gas" aria-label="Acceleratore"><span>GAS</span></button>
  </div>
</div>

<div id="screen-start" class="screen" hidden>
  <div class="card">
    <h1>Taxi Bologna</h1>
    <p class="job">Corsa disponibile</p>
    <p class="route" id="route"></p>
    <p class="best" id="best-start"></p>
    <button id="go" class="primary">Parti</button>
    <label class="opt"><input type="checkbox" id="auto"> Acceleratore automatico</label>
    <button id="install" class="ghost" hidden>Installa app</button>
    <p class="ver" id="version"></p>
  </div>
</div>

<div id="screen-end" class="screen" hidden>
  <div class="card">
    <h1 id="end-title">Corsa completata</h1>
    <div class="lcd"><b id="end-time">0:00.00</b></div>
    <p class="best" id="end-best"></p>
    <button id="again" class="primary">Rigioca</button>
  </div>
</div>

<div id="screen-load" class="screen">
  <div class="card"><h1>Taxi Bologna</h1><p id="load-msg">Carico la mappa…</p><div class="bar"><i id="load-bar"></i></div></div>
</div>

<div id="screen-rotate" class="screen">
  <div class="card"><div class="phone"></div><h1>Ruota il telefono</h1><p>Si gioca in orizzontale.</p></div>
</div>

<div id="update" role="status" hidden><span>Nuova versione pronta</span><button id="update-btn">Aggiorna</button></div>

<a id="osm" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© Collaboratori di OpenStreetMap (ODbL)</a>

<script type="module" src="js/main.js"></script>
</body>
</html>
